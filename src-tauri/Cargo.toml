[package]
name = "boomthere"
version = "0.1.0"
description = "BoomThere — Ctrl+右键 桌面空袭特效"
edition = "2021"

[lib]
name = "boomthere_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "boomthere"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
