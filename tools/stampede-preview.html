<!doctype html>
<html><body style="margin:0;background:#7d8a96">
<canvas id="c"></canvas>
<script type="module">
import { drawAnimal, ALL_FRAMES, ART_W, ART_H, ART_GROUND } from '/src/effects/stampedeArt.ts';
const R = 1.4, cols = ALL_FRAMES.length;
const c = document.getElementById('c');
c.width = ART_W * cols * R; c.height = ART_H * 2 * R;
const ctx = c.getContext('2d');
['horse', 'cow'].forEach((k, row) => ALL_FRAMES.forEach((f, i) => {
  ctx.save(); ctx.scale(R, R); ctx.translate(i * ART_W, row * ART_H);
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.moveTo(0, ART_GROUND); ctx.lineTo(ART_W, ART_GROUND); ctx.stroke();
  ctx.strokeRect(0, 0, ART_W, ART_H);
  drawAnimal(ctx, k, f); ctx.restore();
}));
document.title = 'ready';
</script></body></html>
